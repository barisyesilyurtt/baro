<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>ÇAKBOT</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect fill='%23f0d33a' width='64' height='64'/%3E%3Crect fill='%2316180f' x='10' y='28' width='44' height='8'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="app">
      <header class="hud">
        <div>
          <p class="kit-tag">hurda pistonu</p>
          <h1>ÇAK<span>BOT</span></h1>
        </div>
        <div class="meters">
          <p>skor <b id="score">0</b></p>
          <p>seri <b id="combo">0</b></p>
          <p>can <b id="lives">■■■</b></p>
        </div>
      </header>

      <div id="stage">
        <canvas id="view" width="960" height="540"></canvas>
        <div id="stamp" class="hidden">ÇAK</div>
        <div id="overlay" class="overlay">
          <p class="kit-tag">tek tuş · üç şerit</p>
          <h2>Gelen her şeyi ÇAK.</h2>
          <p class="pitch">Tost, yazıcı, kahve, kedi. Zamanla vur. Kaçırınca yüzüne yapışır.</p>
          <button id="start-btn" type="button">Çakmaya başla</button>
          <p class="hint">W/S veya ▲▼ şerit · Boşluk / tık / buton = ÇAK</p>
        </div>
      </div>

      <div class="controls">
        <button id="up-btn" type="button" class="ghost">▲</button>
        <button id="cak-btn" type="button">ÇAK</button>
        <button id="down-btn" type="button" class="ghost">▼</button>
      </div>
    </div>
    <script src="game.js"></script>
  </body>
</html>
